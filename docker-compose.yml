version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    container_name: app
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - qdrant

volumes:
  qdrant_data:
